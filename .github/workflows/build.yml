name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build.sh

      - name: Package app
        run: ./scripts/package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalControlRestart
          path: |
            dist/UniversalControlRestart-*.zip
            dist/UniversalControlRestart-*.zip.sha256
