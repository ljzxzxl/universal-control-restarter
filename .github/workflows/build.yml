name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build.sh

      - name: Package app
        run: ./scripts/package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalControlRestart
          path: |
            dist/UniversalControlRestart-*.zip
            dist/UniversalControlRestart-*.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          UniversalControlRestart ${VERSION}

          A tiny macOS utility that restarts Universal Control without rebooting your Mac.

          Download `UniversalControlRestart-*.zip`, unzip it, and move `UniversalControlRestart.app` to `/Applications`.

          The `.sha256` file is included for checksum verification.

          ---

          一个很小的 macOS 工具，用来在不重启整台 Mac 的情况下重启“通用控制”。

          下载 `UniversalControlRestart-*.zip`，解压后把 `UniversalControlRestart.app` 拖到 `/Applications`。

          `.sha256` 文件可用于校验下载包。
          EOF

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/UniversalControlRestart-*.zip dist/UniversalControlRestart-*.zip.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/UniversalControlRestart-*.zip dist/UniversalControlRestart-*.zip.sha256 \
              --title "UniversalControlRestart ${VERSION}" \
              --notes-file release-notes.md
          fi
